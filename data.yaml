# ═════════════════════════════════════════════════════════════════
#  IBM Product Synergies Map — content file
#
#  Everything on the live site is generated from this file.
#  Edit it here on GitHub (pencil icon), commit to a new branch and
#  open a pull request. A green tick means your change is valid; a
#  red X means something is wrong — click "Details" to see exactly
#  what and on which line. Merging to main publishes the site
#  automatically (~2 minutes).
#
#  TO ADD A PRODUCT
#    1. Copy an existing block under "products:" and edit it.
#    2. Give it a unique lowercase id (letters/numbers/underscores).
#    3. Set "category:" to one of the ids under "categories:".
#    4. Add its synergies under "connections:" at the bottom.
#    The product counts shown on the site update automatically.
#
#  TO REMOVE A PRODUCT
#    Delete its block AND every connection that mentions its id
#    (the checks will list any you forget).
#
#  TIP: if your text contains a colon (:), wrap the whole text in
#  "double quotes".
# ═════════════════════════════════════════════════════════════════

site:
  title: IBM Product Synergies Map
  brand: Arrow ECS UK
  year: 2026
  footer_hint: Search products · Click category to filter · Click product to view details
  mobile_footer_hint: Tap a product to explore connections
  analytics_url: https://arrow-ollie.goatcounter.com/count   # blank = no analytics

# The six strategic plays. Ids are fixed numbers; each maps to a
# colour defined in template.html (--play-1 … --play-6), so adding
# a new play needs a developer.
plays:
  - id: 1
    name: Automation & Integration
    short: Automation
  - id: 2
    name: Data & AI Platform
    short: Data & AI
  - id: 3
    name: Observability & FinOps
    short: Observability
  - id: 4
    name: Security & Governance
    short: Security
  - id: 5
    name: Infrastructure & Systems
    short: Infrastructure
  - id: 6
    name: Storage Solutions
    short: Storage

# The horizontal lanes on the map, in display order (top to bottom).
# "play" links the lane to a play above (for colour and filtering).
categories:
  - id: automation
    label: Automation & Integration
    play: 1
  - id: observability
    label: Observability & FinOps
    play: 3
  - id: security
    label: Security & Governance
    play: 4
  - id: data_ai
    label: Data & AI Platform
    play: 2
  - id: infrastructure
    label: Infrastructure & Systems
    play: 5
  - id: storage
    label: Storage Solutions
    play: 6

