<style>

    justify-content: space-between;

    flex-shrink: 0;

  }

  }

  #play-legend {
    display: flex;

    flex: 1;
    justify-content: flex-end;
  }

    align-items: center;
    gap: 5px;

    border-radius: 2px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;

    transition: opacity 0.2s;
    border: 1px solid;
    background: transparent;
    white-space: nowrap;
  }

  .legend-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  /* ─── Main ─── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── Map ─── */
  #map-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #0b1a2e;
  }

  #svg-connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Lane strips */
  .lane-strip {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
  }

  .lane-label {
    position: absolute;
    left: 10px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8d8d8d;
    writing-mode: horizontal-tb;
  }

  .pnode {
    position: absolute;
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 10.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border: 1.5px solid;
    background: #1e1e1e;
    transform: translate(-50%, -50%);
    transition: opacity 0.22s ease, transform 0.15s ease, background 0.15s ease;
    letter-spacing: 0.01em;
    z-index: 5;
    user-select: none;
  }

  .pnode:hover {
    transform: translate(-50%, -50%) scale(1.1);
    background: #162848;
    z-index: 30;
  }

  .pnode.dimmed {
    opacity: 0.09;
    transform: translate(-50%, -50%) scale(0.96);
  }

  .pnode.highlighted {
    background: #132244;
    z-index: 20;
  }

  .pnode.selected {
    transform: translate(-50%, -50%) scale(1.13);
    background: #1e3660;
    z-index: 40;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.07);

    flex-shrink: 0;
    border-left: 1px solid #1e3660;
    background: #0f2244;
    display: flex;
    flex-direction: column;
    overflow: hidden;

  #sidebar-inner {
    flex: 1;
    overflow-y: auto;

  #sidebar-inner::-webkit-scrollbar { width: 4px; }
  #sidebar-inner::-webkit-scrollbar-track { background: transparent; }
  #sidebar-inner::-webkit-scrollbar-thumb { background: #1e3660; border-radius: 2px; }

  .sidebar-empty {

    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;

  .play-pill {

const PRODUCTS = [

  { id: 'wxai',            label: 'watsonx.ai',                     cat: 'data_ai',        plays: [2] },

  { id: 'wca_ansible',     label: 'IBM Bob',                        cat: 'data_ai',        plays: [2] },

  // ── Infrastructure & Systems ───────────────────────────────
  { id: 'linuxone',        label: 'LinuxONE',                       cat: 'infrastructure', plays: [5] },
  { id: 'power',           label: 'Power Systems',                  cat: 'infrastructure', plays: [5] },
  { id: 'aix',             label: 'AIX',                            cat: 'infrastructure', plays: [5] },
  { id: 'ibmi',            label: 'IBM i',                          cat: 'infrastructure', plays: [5] },

  // ── Storage Solutions ──────────────────────────────────────

  { id: 'storage_virt',    label: 'Storage Virtualize',             cat: 'storage',        plays: [6] },

  { id: 'storage_ceph',    label: 'Storage Ceph',                   cat: 'storage',        plays: [6] },
  { id: 'storage_scale',   label: 'Storage Scale',                  cat: 'storage',        plays: [6] },

// [from, to, play]  — bidirectional
const CONNECTIONS = [
  // Play 1 – Automation & Integration
  ['concert',      'api_connect',   1],
  ['concert',      'event_auto',    1],
  ['concert',      'webmethods',    1],
  ['concert',      'terraform',     1],

  ['wxai',         'wxgov',         2],
  ['wxai',         'wca_ansible',   2],
  ['wca_ansible',  'wxorch',        2],
  ['wca_ansible',  'wxgov',         2],
  ['wxai',         'instana',       2],

  ['wxorch',       'api_connect',   2],

  // Play 3 – Observability & FinOps
  ['concert',      'instana',       3],

  ['turbonomic',   'cloudability',  3],
  ['apptio',       'cloudability',  3],

  // Play 4 – Security & Governance
  ['vault',        'verify',        4],
  ['vault',        'guardium',      4],

  // Play 5 – Infrastructure & Systems
  ['power',        'aix',           5],

  ['maximo',       'event_auto',    1],

  ['maximo',       'turbonomic',    3],

  ['linuxone',     'storage_scale', 6],

// ═══════════════════════════════════════════
// STATE & LOOKUP
// ═══════════════════════════════════════════

const productMap = {};
PRODUCTS.forEach(p => { productMap[p.id] = p; });

const adjacency = {};
PRODUCTS.forEach(p => { adjacency[p.id] = []; });
CONNECTIONS.forEach(([from, to, play]) => {
  adjacency[from].push({ to, play });
  adjacency[to].push({ to: from, play });
});

// Validate connections reference valid products and plays
CONNECTIONS.forEach(([from, to, play], idx) => {
  if (!productMap[from]) {
    console.error(`[Synergies Map] Invalid connection #${idx}: product "${from}" not found`);
  }
  if (!productMap[to]) {
    console.error(`[Synergies Map] Invalid connection #${idx}: product "${to}" not found`);
  }
  if (!PLAYS[play]) {
    console.error(`[Synergies Map] Invalid connection #${idx}: play ${play} not found`);
  }
});

let selectedId = null;
const nodeEls = {};

// BUILD LEGEND
// ═══════════════════════════════════════════

const legendEl = document.getElementById('play-legend');
if (!legendEl) {

} else {
  Object.values(PLAYS).forEach(play => {
    const chip = document.createElement('div');
    chip.className = 'legend-chip';
    chip.style.borderColor = play.color + '55';

// ═══════════════════════════════════════════

// ═══════════════════════════════════════════

const mapArea = document.getElementById('map-area');
const svgEl = document.getElementById('svg-connections');

if (!mapArea || !svgEl) {
  console.error('[Synergies Map] Required DOM elements not found');
  throw new Error('Map initialization failed: missing required elements');
}

PRODUCTS.forEach(p => {
  const node = document.createElement('div');
  node.className = 'pnode';
  node.dataset.id = p.id;
  node.textContent = p.label;

  const primaryPlay = PLAYS[p.plays[0]];
  node.style.borderColor = primaryPlay.color + 'aa';
  node.style.color = primaryPlay.color;

  node.addEventListener('click', () => handleClick(p.id));
  mapArea.appendChild(node);
  nodeEls[p.id] = node;
});

// ═══════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════

function computeLayout() {
  const rect = mapArea.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;

  const { LANE_MARGIN_LEFT, LANE_MARGIN_RIGHT, LANE_MARGIN_TOP, LANE_MARGIN_BOTTOM } = CONFIG.LAYOUT;

  const usableW = W - LANE_MARGIN_LEFT - LANE_MARGIN_RIGHT;
  const usableH = H - LANE_MARGIN_TOP - LANE_MARGIN_BOTTOM;
  const catCount = CATEGORIES.length;
  const laneH = usableH / catCount;

  // Remove old lane overlays
  mapArea.querySelectorAll('.lane-strip, .lane-label').forEach(el => el.remove());

  CATEGORIES.forEach((cat, catIdx) => {
    const yTop = LANE_MARGIN_TOP + catIdx * laneH;
    const yCen = yTop + laneH / 2;

    // Subtle alternating background
    if (catIdx % 2 === 0) {
      const strip = document.createElement('div');
      strip.className = 'lane-strip';
      strip.style.top = yTop + 'px';
      strip.style.height = laneH + 'px';
      strip.style.background = 'rgba(255,255,255,0.012)';
      mapArea.insertBefore(strip, svgEl);
    }

    // Lane label
    const label = document.createElement('div');
    label.className = 'lane-label';
    label.textContent = cat.label;
    label.style.top = yCen + 'px';
    label.style.left = '10px';
    mapArea.appendChild(label);
  });

  // Group products by category and calculate equal spacing
  CATEGORIES.forEach((cat, catIdx) => {
    const productsInCat = PRODUCTS.filter(p => p.cat === cat.id);
    if (productsInCat.length === 0) return;

    const yTop = LANE_MARGIN_TOP + catIdx * laneH;
    const yCen = yTop + laneH / 2;

    // Measure actual widths of product nodes
    const widths = productsInCat.map(p => {
      const el = nodeEls[p.id];
      return el.offsetWidth || 0;
    });

    // Calculate total width of all products
    const totalProductWidth = widths.reduce((sum, w) => sum + w, 0);
    
    // Calculate available space for gaps
    const availableSpace = usableW - totalProductWidth;
    
    // Calculate equal gap size (n products = n+1 gaps for edge spacing)
    const gapSize = availableSpace / (productsInCat.length + 1);

    // Position products with equal gaps
    let currentX = LANE_MARGIN_LEFT + gapSize;
    
    productsInCat.forEach((p, idx) => {
      const width = widths[idx];
      const x = currentX + width / 2; // Center of the product node
      const y = yCen;

      p._px = x;
      p._py = y;

      const el = nodeEls[p.id];
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      // Move to next position
      currentX += width + gapSize;
    });
  });
}

// ═══════════════════════════════════════════

// ═══════════════════════════════════════════

function drawConnections(activeId = null) {
  svgEl.innerHTML = '<defs id="svg-defs"></defs>';

  const drawn = new Set();

  // Sort: inactive first (so active ones render on top)
  const sortedConns = [...CONNECTIONS].sort(([a,b,pa], [c,d,pd]) => {
    if (!activeId) return 0;
    const aActive = a === activeId || b === activeId;
    const bActive = c === activeId || d === activeId;
    return aActive - bActive;
  });

  sortedConns.forEach(([from, to, play]) => {
    const key = [from, to].sort().join('|');
    if (drawn.has(key)) return;
    drawn.add(key);

    const p1 = productMap[from];
    const p2 = productMap[to];
    if (!p1._px || !p2._px) return;

    const x1 = p1._px, y1 = p1._py;
    const x2 = p2._px, y2 = p2._py;
    const color = PLAYS[play].color;

    const isActive = !activeId || activeId === from || activeId === to;

    let d;
    const sameRow = Math.abs(y1 - y2) < CONFIG.SAME_ROW_THRESHOLD;
    if (sameRow) {
      // Horizontal arc above the row
      const mx = (x1 + x2) / 2;
      const arcH = Math.abs(x2 - x1) * CONFIG.CURVES.ARC_HEIGHT_FACTOR;
      d = `M ${x1} ${y1} C ${mx} ${y1 - arcH}, ${mx} ${y2 - arcH}, ${x2} ${y2}`;
    } else {
      // S-curve between rows
      const my = (y1 + y2) / 2;
      const bendX1 = x1 + (x2 - x1) * CONFIG.CURVES.BEND_START_FACTOR;
      const bendX2 = x1 + (x2 - x1) * CONFIG.CURVES.BEND_END_FACTOR;
      d = `M ${x1} ${y1} C ${bendX1} ${y1}, ${bendX2} ${y2}, ${x2} ${y2}`;
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');

    if (!activeId) {
      // Default state – subtle
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '1.4');
      path.setAttribute('opacity', '0.28');
    } else if (isActive) {
      // Highlighted
      const pathLength = path.getTotalLength();
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '2.4');
      path.setAttribute('opacity', '0.95');
      path.setAttribute('stroke-dasharray', pathLength);
      path.setAttribute('stroke-dashoffset', pathLength);
      path.classList.add('path-active');
      // Force reflow to ensure animation starts
      path.getBoundingClientRect();
      path.setAttribute('stroke-dashoffset', '0');
    } else {
      // Dimmed
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.04');
    }

    svgEl.appendChild(path);
  });
}

// ═══════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════

function handleClick(id) {
  // Validate product exists
  if (!productMap[id]) {
    console.warn(`[Synergies Map] Product "${id}" not found`);
    return;
  }

  if (selectedId === id) {
    resetView();
    return;
  }

  selectedId = id;
  const product = productMap[id];
  const neighbors = new Set(adjacency[id].map(a => a.to));
  neighbors.add(id);

  Object.entries(nodeEls).forEach(([pid, el]) => {
    el.classList.remove('dimmed', 'highlighted', 'selected');
    if (pid === id) {
      el.classList.add('selected');
    } else if (neighbors.has(pid)) {
      el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed');
    }
  });

  drawConnections(id);
  renderSidebar(product);
  document.getElementById('reset-btn').style.display = 'block';
}

function resetView() {
  selectedId = null;
  Object.values(nodeEls).forEach(el => {
    el.classList.remove('dimmed', 'highlighted', 'selected');
  });
  drawConnections();
  renderSidebarEmpty();
  document.getElementById('reset-btn').style.display = 'none';
}

document.getElementById('reset-btn').addEventListener('click', resetView);

// Event delegation for connection row clicks
document.getElementById('sidebar-inner').addEventListener('click', (e) => {
  const connRow = e.target.closest('.conn-row[data-target]');
  if (connRow) {
    handleClick(connRow.dataset.target);
  }
});

// ═══════════════════════════════════════════
// SIDEBAR RENDER
// ═══════════════════════════════════════════

function renderSidebarEmpty() {
  document.getElementById('sidebar-inner').innerHTML = `
    <div class="sidebar-empty">
      ${EMPTY_STATE_SVG}
      <p>Select any product node to highlight its cross-sell connections</p>
    </div>`;
}

function renderSidebar(product) {
  const catLabel = CATEGORIES.find(c => c.id === product.cat)?.label || '';
  const conns = adjacency[product.id];

  const playsHtml = product.plays.map(pId => {
    const play = PLAYS[pId];
    return `<span class="play-pill" style="color:${play.color};border-color:${play.color}44;background:${play.color}11">
      <span class="dot" style="background:${play.color}"></span>${play.short}
    </span>`;
  }).join('');

  // Group connections by play
  const connsHtml = conns.map(({ to, play }) => {
    const target = productMap[to];
    const targetPrimaryPlay = PLAYS[target.plays[0]];
    const targetCategory = CATEGORIES.find(c => c.id === target.cat);
    return `<div class="conn-row" data-target="${to}">
      <div class="conn-accent" style="background:${targetPrimaryPlay.color}"></div>
      <div class="conn-info">
        <div class="conn-name">${target.label}</div>
        <div class="conn-play">${targetPrimaryPlay.short}</div>
      </div>
      <div class="conn-arrow">›</div>
    </div>`;
  }).join('');

  document.getElementById('sidebar-inner').innerHTML = `
    <div class="sb-product-name">${product.label}</div>
    <div class="sb-category">${catLabel}</div>
    
    <div class="sb-section-label">Featured in plays</div>
    ${playsHtml}
    
    <div class="sb-section-label">${conns.length} connection${conns.length !== 1 ? 's' : ''}</div>
    ${connsHtml}
  `;
}

// ═══════════════════════════════════════════
// INIT & RESIZE
// ═══════════════════════════════════════════

function init() {
  renderSidebarEmpty();
  computeLayout();
  drawConnections();
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    computeLayout();
    if (selectedId) drawConnections(selectedId);
    else drawConnections();
  }, CONFIG.ANIMATION.RESIZE_DEBOUNCE_MS);
});

// Wait for layout to settle
requestAnimationFrame(() => requestAnimationFrame(init));
</script>
