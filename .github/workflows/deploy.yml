name: Deploy to IBM Cloud Object Storage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build site from data.yaml
        run: |
          pip install pyyaml
          python build.py

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install cloud-object-storage -f

      - name: Authenticate to IBM Cloud
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          ibmcloud login --apikey "$IBM_CLOUD_API_KEY" --no-region
          ibmcloud cos config crn --crn "${{ secrets.COS_INSTANCE_CRN }}" --force
          ibmcloud cos config region --region "${{ secrets.COS_REGION }}"

      - name: Deploy to Object Storage
        env:
          COS_BUCKET_NAME: ${{ secrets.COS_BUCKET_NAME }}
        run: |
          ibmcloud cos upload \
            --bucket "$COS_BUCKET_NAME" \
            --key index.html \
            --file dist/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=3600, must-revalidate"

          ibmcloud cos upload \
            --bucket "$COS_BUCKET_NAME" \
            --key IBM_Synergies_Map.html \
            --file dist/index.html \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=3600, must-revalidate"
