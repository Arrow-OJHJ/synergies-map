name: Check i18n

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run i18n checker
        run: python tools/check_i18n.py
