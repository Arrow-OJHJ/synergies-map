<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23161616%22/><circle cx=%2235%22 cy=%2250%22 r=%2210%22 fill=%22%230f62fe%22/><circle cx=%2265%22 cy=%2250%22 r=%2210%22 fill=%22%23198038%22/></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────
     Carbon Design System tokens
     ───────────────────────────────────────────── */
  :root {
    /* White theme */
    --cds-background: #ffffff;
    --cds-background-hover: #e8e8e8;
    --cds-background-active: #c6c6c6;
    --cds-background-selected: #e0e0e0;
    --cds-layer-01: #f4f4f4;
    --cds-layer-02: #ffffff;
    --cds-layer-accent-01: #e0e0e0;
    --cds-layer-hover-01: #e8e8e8;
    --cds-field-01: #f4f4f4;
    --cds-border-subtle-01: #e0e0e0;
    --cds-border-subtle-02: #c6c6c6;
    --cds-border-strong-01: #8d8d8d;
    --cds-text-primary: #161616;
    --cds-text-secondary: #525252;
    --cds-text-placeholder: #a8a8a8;
    --cds-text-helper: #6f6f6f;
    --cds-text-on-color: #ffffff;
    --cds-icon-primary: #161616;
    --cds-icon-secondary: #525252;
    --cds-button-primary: #0f62fe;
    --cds-button-primary-hover: #0050e6;
    --cds-button-primary-active: #002d9c;
    --cds-focus: #0f62fe;
    --cds-interactive: #0f62fe;
    --cds-link-primary: #0f62fe;

    /* Play colors — Carbon palette, 60-level on light */
    --play-1: #0043ce; /* Blue 70   — Automation */
    --play-2: #198038; /* Green 60  — Data & AI */
    --play-3: #8a3ffc; /* Purple 60 — Observability */
    --play-4: #da1e28; /* Red 60    — Security */
    --play-5: #007d79; /* Teal 60   — Infrastructure */
    --play-6: #d12771; /* Magenta 60 — Storage */

    --font-sans: 'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  }

  [data-theme="dark"] {
    /* Gray 100 theme */
    --cds-background: #161616;
    --cds-background-hover: #353535;
    --cds-background-active: #525252;
    --cds-background-selected: #353535;
    --cds-layer-01: #262626;
    --cds-layer-02: #393939;
    --cds-layer-accent-01: #525252;
    --cds-layer-hover-01: #333333;
    --cds-field-01: #262626;
    --cds-border-subtle-01: #393939;
    --cds-border-subtle-02: #525252;
    --cds-border-strong-01: #6f6f6f;
    --cds-text-primary: #f4f4f4;
    --cds-text-secondary: #c6c6c6;
    --cds-text-placeholder: #6f6f6f;
    --cds-text-helper: #8d8d8d;
    --cds-icon-primary: #f4f4f4;
    --cds-icon-secondary: #c6c6c6;
    --cds-button-primary: #0f62fe;
    --cds-button-primary-hover: #0353e9;
    --cds-button-primary-active: #002d9c;
    --cds-focus: #ffffff;
    --cds-interactive: #4589ff;
    --cds-link-primary: #78a9ff;

    /* Play colors — 40-level on dark */
    --play-1: #4589ff;
    --play-2: #6fdc8c;
    --play-3: #be95ff;
    --play-4: #fa4d56;
    --play-5: #3ddbd9;
    --play-6: #ff7eb6;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 20px;
    color: var(--cds-text-primary);
    background: var(--cds-background);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── App shell ─── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── Carbon UI Shell (two bars) ── */
  .cds-shell { flex-shrink: 0; }

  .cds-shell__bar1 {
    height: 48px;
    background: #161616;
    color: #ffffff;
    padding: 0 0 0 16px;
    display: flex;
    align-items: stretch;
  }

  .cds-shell__brand {
    display: inline-flex;
    align-items: center;
    gap: 0;
  }
  .cds-shell__wordmark {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.01em;
  }
  .cds-shell__divider {
    display: inline-block;
    width: 1px;
    height: 16px;
    background: #393939;
    margin: 0 12px;
  }
  .cds-shell__product {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
    color: #c6c6c6;
  }

  .cds-shell__meta {
    margin-left: auto;
    display: flex;
    align-items: stretch;
    gap: 0;
  }
  .cds-shell__meta-text {
    display: inline-flex;
    align-items: center;
    padding: 0 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8d8d8d;
  }
  .cds-shell__meta-text strong {
    color: #c6c6c6;
    font-weight: 500;
  }

  /* Visually hidden — a11y label */
  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0; padding: 0; margin: -1px;
  }

  /* Theme toggle button in shell */
  .cds-shell__theme-btn {
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #c6c6c6;
    cursor: pointer;
    transition: background-color 0.11s, color 0.11s;
    font-size: 18px;
    line-height: 1;
  }
  .cds-shell__theme-btn:hover { background: #353535; color: #ffffff; }
  .cds-shell__theme-btn:focus-visible { outline: 2px solid #ffffff; outline-offset: -2px; }
  .cds-shell__theme-btn .icon-glyph {
    display: inline-block;
    line-height: 1;
    transition: transform 0.2s ease;
  }
  [data-theme="dark"] .cds-shell__theme-btn .icon-glyph {
    transform: rotate(180deg);
  }

  .cds-shell__bar2 {
    height: 48px;
    background: var(--cds-background);
    border-bottom: 1px solid var(--cds-border-subtle-01);
    display: flex;
    align-items: stretch;
    padding: 0 16px;
    gap: 16px;
  }

  /* Search box */
  .search-container {
    display: flex;
    align-items: center;
    position: relative;
    min-width: 360px;
  }
  
  .search-input {
    width: 100%;
    height: 32px;
    padding: 0 32px 0 12px;
    background: var(--cds-field-01);
    border: 1px solid var(--cds-border-subtle-01);
    border-bottom: 1px solid var(--cds-border-strong-01);
    color: var(--cds-text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    outline: none;
    transition: border-color 0.11s, background-color 0.11s;
  }
  
  .search-input:hover {
    background: var(--cds-background-hover);
  }
  
  .search-input:focus {
    border-color: var(--cds-focus);
    border-bottom-color: var(--cds-focus);
  }
  
  .search-input::placeholder {
    color: var(--cds-text-placeholder);
  }
  
  .search-clear {
    position: absolute;
    right: 4px;
    width: 24px;
    height: 24px;
    background: transparent;
    border: none;
    color: var(--cds-icon-secondary);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background-color 0.11s;
  }
  
  .search-clear:hover {
    background: var(--cds-background-hover);
    color: var(--cds-icon-primary);
  }
  
  .search-clear.is-visible {
    display: flex;
  }
  
  .search-results-count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--cds-text-secondary);
    white-space: nowrap;
    padding: 0 8px;
  }

  #play-legend {
    display: flex;
    align-items: stretch;
    gap: 0;
    flex: 1;
  }

  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    height: 48px;
    background: transparent;
    border: none;
    color: var(--cds-text-secondary);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.11s, color 0.11s;
    border-bottom: 2px solid transparent;
  }
  .legend-chip:hover { background: var(--cds-background-hover); color: var(--cds-text-primary); }
  .legend-chip:focus-visible { outline: 2px solid var(--cds-focus); outline-offset: -2px; }
  .legend-chip .dot {
    width: 10px;
    height: 10px;
    border-radius: 0;
    flex-shrink: 0;
  }
  .legend-chip.is-active {
    color: var(--cds-text-primary);
    background: var(--cds-background-hover);
  }
  .legend-chip.is-active[data-play-color] { border-bottom-color: var(--legend-color, var(--cds-interactive)); }

  /* ─── Main row ─── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    background: var(--cds-background);
  }

  /* ─── Map area ─── */
  #map-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: var(--cds-background);
  }

  #svg-connections {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Lane strips & labels */
  .lane-strip {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    background: var(--cds-layer-01);
  }
  .lane-divider {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--cds-border-subtle-01);
    pointer-events: none;
  }
  .lane-label {
    position: absolute;
    left: 16px;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-secondary);
    white-space: nowrap;
    z-index: 2;
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .lane-label .lane-dot {
    width: 8px; height: 8px;
    background: var(--lane-color, var(--cds-text-secondary));
    flex-shrink: 0;
  }

  /* ─── Product nodes (Carbon tag style) ─── */
  .pnode {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 6px 10px 6px 10px;
    background: var(--cds-background);
    border: 1px solid var(--cds-border-subtle-02);
    border-left: 3px solid var(--node-color, var(--cds-border-strong-01));
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--cds-text-primary);
    cursor: pointer;
    white-space: nowrap;
    z-index: 5;
    user-select: none;
    transition: opacity 0.18s ease, background-color 0.11s, border-color 0.11s, box-shadow 0.11s;
    line-height: 1.2;
  }

  .pnode:hover {
    background: var(--cds-background-hover);
    z-index: 30;
  }
  .pnode:focus-visible {
    outline: 2px solid var(--cds-focus);
    outline-offset: -2px;
  }
  .pnode.dimmed {
    opacity: 0.22;
  }
  .pnode.highlighted {
    background: var(--cds-background-hover);
    z-index: 20;
  }
  .pnode.selected {
    background: #161616;
    color: #ffffff;
    border-color: #161616;
    border-left-color: var(--node-color);
    z-index: 40;
    box-shadow: 0 2px 6px rgba(0,0,0,0.16);
  }
  [data-theme="dark"] .pnode.selected {
    background: #f4f4f4;
    color: #161616;
    border-color: #f4f4f4;
  }

  /* Style variants applied via [data-node-style] on #app */
  #app[data-node-style="chip"] .pnode {
    border-left: 1px solid var(--cds-border-subtle-02);
    padding-left: 10px;
    position: relative;
  }
  #app[data-node-style="chip"] .pnode::before {
    content: '';
    position: absolute;
    left: -1px;
    top: -1px;
    bottom: -1px;
    width: 4px;
    background: var(--node-color, var(--cds-border-strong-01));
  }
  #app[data-node-style="chip"] .pnode { padding-left: 14px; }

  #app[data-node-style="dot"] .pnode {
    border-left: 1px solid var(--cds-border-subtle-02);
    padding-left: 26px;
    position: relative;
  }
  #app[data-node-style="dot"] .pnode::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: var(--node-color, var(--cds-border-strong-01));
  }

  /* ─── Sidebar ─── */
  #sidebar {
    width: 320px;
    flex-shrink: 0;
    border-left: 1px solid var(--cds-border-subtle-01);
    background: var(--cds-layer-01);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    height: 48px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--cds-border-subtle-01);
    background: var(--cds-layer-01);
    flex-shrink: 0;
  }
  .sidebar-title {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-secondary);
  }

  #reset-btn {
    height: 32px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid var(--cds-border-strong-01);
    border-radius: 0;
    color: var(--cds-text-primary);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.11s;
    display: none;
  }
  #reset-btn:hover { background: var(--cds-background-hover); }
  #reset-btn:focus-visible { outline: 2px solid var(--cds-focus); outline-offset: -2px; }

  #sidebar-inner {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
  }
  #sidebar-inner::-webkit-scrollbar { width: 6px; }
  #sidebar-inner::-webkit-scrollbar-track { background: transparent; }
  #sidebar-inner::-webkit-scrollbar-thumb { background: var(--cds-border-subtle-02); }

  .sidebar-empty {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    color: var(--cds-text-secondary);
    padding: 8px 0;
  }
  .sidebar-empty .empty-icon {
    width: 32px; height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--cds-background);
    border: 1px solid var(--cds-border-subtle-01);
  }
  .sidebar-empty .empty-icon svg {
    width: 18px; height: 18px;
    color: var(--cds-icon-secondary);
  }
  .sidebar-empty p {
    font-size: 13px;
    line-height: 1.4;
    color: var(--cds-text-secondary);
  }
  .sidebar-empty .empty-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-helper);
    margin-top: 4px;
  }

  /* Sidebar — product detail */
  .sb-tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-secondary);
    margin-bottom: 12px;
  }
  .sb-product-name {
    font-family: var(--font-sans);
    font-size: 20px;
    line-height: 1.25;
    font-weight: 400;
    color: var(--cds-text-primary);
    margin-bottom: 6px;
  }
  .sb-category {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--cds-text-secondary);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cds-border-subtle-01);
  }

  .sb-section-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-secondary);
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .sb-section-label:first-of-type { margin-top: 0; }

  .play-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px 4px 6px;
    background: var(--cds-background);
    border: 1px solid var(--cds-border-subtle-02);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--cds-text-primary);
    margin: 0 4px 4px 0;
  }
  .play-pill .dot {
    width: 8px; height: 8px;
    background: var(--play-color);
  }

  .conn-list {
    display: flex;
    flex-direction: column;
    background: var(--cds-background);
    border: 1px solid var(--cds-border-subtle-01);
  }
  .conn-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--cds-background);
    border: none;
    border-bottom: 1px solid var(--cds-border-subtle-01);
    cursor: pointer;
    text-align: left;
    transition: background-color 0.11s;
    width: 100%;
    font-family: var(--font-sans);
    color: var(--cds-text-primary);
  }
  .conn-row:last-child { border-bottom: none; }
  .conn-row:hover { background: var(--cds-background-hover); }
  .conn-row:focus-visible { outline: 2px solid var(--cds-focus); outline-offset: -2px; }

  .conn-accent {
    width: 4px;
    height: 28px;
    background: var(--accent-color, var(--cds-text-secondary));
    flex-shrink: 0;
  }
  .conn-info { flex: 1; min-width: 0; }
  .conn-name {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--cds-text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-play {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.3;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--cds-text-secondary);
    margin-top: 2px;
  }
  .conn-arrow {
    font-size: 16px;
    color: var(--cds-icon-secondary);
    flex-shrink: 0;
    font-weight: 300;
  }

  .conn-explanation {
    font-size: 12px;
    line-height: 1.4;
    color: var(--cds-text-secondary);
    margin-top: 4px;
    font-style: italic;
  }

  /* Competitive positioning */
  .sb-competitors {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cds-border-subtle-01);
  }

  .competitor-tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    background: var(--cds-background);
    border: 1px solid var(--cds-border-subtle-02);
    font-size: 12px;
    line-height: 1.3;
    color: var(--cds-text-secondary);
    font-family: var(--font-sans);
    white-space: nowrap;
  }

  .sb-differentiators {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cds-border-subtle-01);
  }

  .differentiator-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
  }

  .differentiator-item:first-child {
    padding-top: 0;
  }

  .diff-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    background: var(--cds-interactive);
    color: var(--cds-text-on-color);
    font-size: 12px;
    font-weight: 600;
    border-radius: 50%;
    margin-top: 1px;
  }

  .diff-text {
    flex: 1;
    font-size: 13px;
    line-height: 1.4;
    color: var(--cds-text-primary);
  }

  /* Product details in sidebar */
  .sb-description {
    font-size: 13px;
    line-height: 1.5;
    color: var(--cds-text-secondary);
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--cds-border-subtle-01);
  }

  .sb-value {
    font-size: 13px;
    line-height: 1.5;
    color: var(--cds-text-primary);
    background: var(--cds-background);
    padding: 12px;
    border-left: 3px solid var(--cds-interactive);
    margin-bottom: 16px;
  }

  .sb-questions {
    margin-top: 20px;

<body>
<div id="app" data-theme="light" data-node-style="tag" data-conn-style="curved">

  <!-- ── Carbon UI Shell ── -->

  <div id="mobile-view">

<script>
/* ════════════════════════════════════════════════════════
   Tweaks (defaults persisted via host)
   ════════════════════════════════════════════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "nodeStyle": "tag",
  "connStyle": "curved",
  "laneFill": "zebra"
}/*EDITMODE-END*/;

let tweakState = { ...TWEAK_DEFAULTS };

/* ════════════════════════════════════════════════════════
   Data — GENERATED from data.yaml by build.py
   Do not edit content here: edit data.yaml, then run
       python build.py
   and open dist/index.html.
   ════════════════════════════════════════════════════════ */
/*DATA-BEGIN*/
setTimeout(() => {
  document.body.innerHTML = '<div style="font:16px/1.6 sans-serif; padding:2rem; max-width:60ch">' +
    '<h1 style="font-size:20px">This is the template, not the site</h1>' +
    '<p>All content lives in <b>data.yaml</b>. Build the real page with:</p>' +
    '<pre style="background:#eee; padding:8px 12px">python build.py</pre>' +
    '<p>then open <b>dist/index.html</b>.</p></div>';
});
throw new Error('template.html is not runnable - build dist/index.html from data.yaml');
/*DATA-END*/
const playColor = (id) => getComputedStyle(document.documentElement).getPropertyValue(PLAYS[id].varName).trim();

/* ════════════════════════════════════════════════════════
   Layout config
   ════════════════════════════════════════════════════════ */
const CONFIG = {
  LAYOUT: { LEFT: 200, RIGHT: 24, TOP: 24, BOTTOM: 24 },
  CURVES: { ARC_FACTOR: 0.14, BEND_START: 0.25, BEND_END: 0.75 },
  SAME_ROW_THRESHOLD: 5,
};

/* ════════════════════════════════════════════════════════
   State & lookup
   ════════════════════════════════════════════════════════ */
const productMap = {};
PRODUCTS.forEach(p => { productMap[p.id] = p; });

const adjacency = {};
PRODUCTS.forEach(p => { adjacency[p.id] = []; });
CONNECTIONS.forEach(([from, to, play, explanation]) => {
  adjacency[from].push({ from, to, play, explanation });
  adjacency[to].push({ from: to, to: from, play, explanation });
});

// Data validation
function validateData() {
  const errors = [];
  
  // Validate products have required fields
  PRODUCTS.forEach(p => {
    if (!p.id || !p.label || !p.cat || !p.plays || !Array.isArray(p.plays)) {
      errors.push(`Product missing required fields: ${p.id || 'unknown'}`);
    }
  });
  
  // Validate connections reference valid products
  CONNECTIONS.forEach(([from, to, play, explanation], idx) => {
    if (!productMap[from]) {
      errors.push(`Connection ${idx}: invalid 'from' ID: ${from}`);
    }
    if (!productMap[to]) {
      errors.push(`Connection ${idx}: invalid 'to' ID: ${to}`);
    }
    if (!PLAYS[play]) {
      errors.push(`Connection ${idx}: invalid play ID: ${play}`);
    }
  });
  
  // Validate categories reference valid plays
  CATEGORIES.forEach(cat => {
    if (!PLAYS[cat.playId]) {
      errors.push(`Category ${cat.id}: invalid playId: ${cat.playId}`);
    }
  });
  
  if (errors.length > 0) {
    console.error('Data validation errors:', errors);
    return false;
  }
  
  return true;
}

// Run validation
if (!validateData()) {
  console.warn('Data validation failed - some features may not work correctly');
}

let selectedId = null;
let activePlayFilter = null;
let searchQuery = '';
const nodeEls = {};

/* ════════════════════════════════════════════════════════
   Search functionality
   ════════════════════════════════════════════════════════ */
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
const searchResults = document.getElementById('search-results');

function performSearch(query) {
  searchQuery = query.toLowerCase().trim();
  
  // Show/hide clear button
  searchClear.classList.toggle('is-visible', searchQuery.length > 0);
  
  if (!searchQuery) {
    // Clear search - reset all highlighting
    Object.values(nodeEls).forEach(el => {
      el.classList.remove('dimmed', 'highlighted');
    });
    searchResults.textContent = '';
    drawConnections();
    return;
  }
  
  // Search across product names, descriptions, value props, and questions
  const matches = new Set();
  PRODUCTS.forEach(p => {
    const searchableText = [
      p.label,
      p.desc,
      p.value,
      ...p.questions
    ].join(' ').toLowerCase();
    
    if (searchableText.includes(searchQuery)) {
      matches.add(p.id);
    }
  });
  
  // Also include products connected to matches
  const involved = new Set(matches);
  CONNECTIONS.forEach(([a, b, play, explanation]) => {
    if (matches.has(a)) involved.add(b);
    if (matches.has(b)) involved.add(a);
  });
  
  // Update display
  Object.entries(nodeEls).forEach(([id, el]) => {
    if (involved.has(id)) {
      el.classList.add('highlighted');
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
      el.classList.remove('highlighted');
    }
  });
  
  // Update results count
  searchResults.textContent = `${matches.size} product${matches.size !== 1 ? 's' : ''} found`;
  
  // Redraw connections to show only relevant ones
  drawConnectionsForSearch(involved);
}

function drawConnectionsForSearch(involvedProducts) {
  svgEl.innerHTML = '<defs id="svg-defs"></defs>';
  
  const sorted = [...uniqueEdges];
  
  sorted.forEach(edge => {
    const { from, to } = edge;
    const p1 = productMap[from];
    const p2 = productMap[to];
    if (!p1._px || !p2._px) return;
    
    // Only draw if both products are involved
    const isActive = involvedProducts.has(from) && involvedProducts.has(to);
    if (!isActive) return;
    
    const x1 = p1._px, y1 = p1._py;
    const x2 = p2._px, y2 = p2._py;
    
    const colorPlayId = connectionPlayId(from, to);
    const color = playColor(colorPlayId);
    
    let d;
    const sameRow = Math.abs(y1 - y2) < CONFIG.SAME_ROW_THRESHOLD;
    
    if (tweakState.connStyle === 'ortho') {
      if (sameRow) {
        const arcH = Math.abs(x2 - x1) * 0.18 + 12;
        d = `M ${x1} ${y1} L ${x1} ${y1 - arcH} L ${x2} ${y2 - arcH} L ${x2} ${y2}`;
      } else {
        const my = (y1 + y2) / 2;
        d = `M ${x1} ${y1} L ${x1} ${my} L ${x2} ${my} L ${x2} ${y2}`;
      }
    } else {
      if (sameRow) {
        const mx = (x1 + x2) / 2;
        const arcH = Math.abs(x2 - x1) * CONFIG.CURVES.ARC_FACTOR;
        d = `M ${x1} ${y1} C ${mx} ${y1 - arcH}, ${mx} ${y2 - arcH}, ${x2} ${y2}`;
      } else {
        const bendX1 = x1 + (x2 - x1) * CONFIG.CURVES.BEND_START;
        const bendX2 = x1 + (x2 - x1) * CONFIG.CURVES.BEND_END;
        d = `M ${x1} ${y1} C ${bendX1} ${y1}, ${bendX2} ${y2}, ${x2} ${y2}`;
      }
    }
    
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('opacity', '0.7');
    
    svgEl.appendChild(path);
  });
}

function togglePlayFilter(playId) {
  // Clear search when using play filter
  if (searchQuery) {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('is-visible');
    searchResults.textContent = '';
  }
  
  activePlayFilter = (activePlayFilter === playId) ? null : playId;
  document.querySelectorAll('.legend-chip').forEach(c => {
    c.classList.toggle('is-active', Number(c.dataset.play) === activePlayFilter);
  });
  // Reset any selected node and redraw with filter
  if (selectedId) resetSelection(false);
  applyPlayFilter();
  drawConnections();
}

function applyPlayFilter() {
  if (!activePlayFilter) {
    Object.values(nodeEls).forEach(el => el.classList.remove('dimmed', 'highlighted'));
    return;
  }
  // Find the category associated with this play
  const playCategory = CATEGORIES.find(cat => cat.playId === activePlayFilter);
  if (!playCategory) return;
  
  // Get all products in this category
  const categoryProducts = new Set(
    PRODUCTS.filter(p => p.cat === playCategory.id).map(p => p.id)
  );
  
  // Highlight products in this category AND any products connected to them (regardless of play)
  const involved = new Set(categoryProducts);
  CONNECTIONS.forEach(([a, b, p, explanation]) => {
    if (categoryProducts.has(a)) involved.add(b);
    if (categoryProducts.has(b)) involved.add(a);
  });
  
  Object.entries(nodeEls).forEach(([id, el]) => {
    if (involved.has(id)) el.classList.add('highlighted');
    else el.classList.add('dimmed');
    el.classList.remove('selected');
  });
}

/* ════════════════════════════════════════════════════════
   Build nodes

/* ════════════════════════════════════════════════════════
   Layout
   ════════════════════════════════════════════════════════ */
function computeLayout() {
  const rect = mapArea.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  const { LEFT, RIGHT, TOP, BOTTOM } = CONFIG.LAYOUT;

  const usableW = W - LEFT - RIGHT;
  const usableH = H - TOP - BOTTOM;
  const catCount = CATEGORIES.length;
  const laneH = usableH / catCount;

  // Clear lane overlays
  mapArea.querySelectorAll('.lane-strip, .lane-label, .lane-divider').forEach(el => el.remove());

  CATEGORIES.forEach((cat, catIdx) => {
    const yTop = TOP + catIdx * laneH;
    const yCen = yTop + laneH / 2;

    if (tweakState.laneFill === 'zebra' && catIdx % 2 === 1) {
      const strip = document.createElement('div');
      strip.className = 'lane-strip';
      strip.style.top = yTop + 'px';
      strip.style.height = laneH + 'px';
      mapArea.insertBefore(strip, svgEl);
    }

    if (catIdx > 0) {
      const div = document.createElement('div');
      div.className = 'lane-divider';
      div.style.top = yTop + 'px';
      mapArea.insertBefore(div, svgEl);
    }

    const label = document.createElement('div');
    label.className = 'lane-label';
    label.style.setProperty('--lane-color', `var(${PLAYS[cat.playId].varName})`);
    label.style.top = yCen + 'px';
    label.innerHTML = `<span class="lane-dot"></span>${cat.label}`;
    mapArea.appendChild(label);
  });

  // Position products
  CATEGORIES.forEach((cat, catIdx) => {
    const productsInCat = PRODUCTS.filter(p => p.cat === cat.id);
    if (productsInCat.length === 0) return;

    const yTop = TOP + catIdx * laneH;
    const yCen = yTop + laneH / 2;

    const widths = productsInCat.map(p => nodeEls[p.id].offsetWidth || 0);
    const totalProductWidth = widths.reduce((sum, w) => sum + w, 0);
    const availableSpace = usableW - totalProductWidth;
    const gapSize = availableSpace / (productsInCat.length + 1);

    let currentX = LEFT + gapSize;
    productsInCat.forEach((p, idx) => {
      const width = widths[idx];
      const x = currentX + width / 2;
      const y = yCen;
      p._px = x; p._py = y;
      const el = nodeEls[p.id];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      currentX += width + gapSize;
    });
  });
}

/* ════════════════════════════════════════════════════════
   Connection color rule
   - Same lane: that lane's play color
   - Cross-lane: lower-on-screen (larger index) lane's color
   ════════════════════════════════════════════════════════ */
const catIndexById = {};
CATEGORIES.forEach((c, i) => { catIndexById[c.id] = i; });

function connectionPlayId(fromId, toId) {
  const fromIdx = catIndexById[productMap[fromId].cat];
  const toIdx   = catIndexById[productMap[toId].cat];
  const lowerIdx = Math.max(fromIdx, toIdx); // larger idx == lower on screen
  return CATEGORIES[lowerIdx].playId;
}

/* Build unique edge list (deduped by from↔to pair). Each edge tracks
   the set of strategic plays it appears in, used for filtering. */
const uniqueEdges = (() => {
  const map = new Map();
  CONNECTIONS.forEach(([from, to, play, explanation]) => {
    const [a, b] = [from, to].sort();
    const key = `${a}|${b}`;
    if (!map.has(key)) map.set(key, { from: a, to: b, plays: new Set(), explanations: {} });
    map.get(key).plays.add(play);
    map.get(key).explanations[`${from}→${to}`] = explanation;
  });
  return [...map.values()].map(e => ({ from: e.from, to: e.to, plays: [...e.plays], explanations: e.explanations }));
})();

/* ════════════════════════════════════════════════════════
   Draw connections
   ════════════════════════════════════════════════════════ */
function drawConnections(activeId = null) {
  svgEl.innerHTML = '<defs id="svg-defs"></defs>';

  // When play filter is active, determine which products are involved
  let involvedProducts = null;
  if (activePlayFilter && !activeId) {
    const playCategory = CATEGORIES.find(cat => cat.playId === activePlayFilter);
    if (playCategory) {
      const categoryProducts = new Set(
        PRODUCTS.filter(p => p.cat === playCategory.id).map(p => p.id)
      );
      involvedProducts = new Set(categoryProducts);
      CONNECTIONS.forEach(([a, b, p, explanation]) => {
        if (categoryProducts.has(a)) involvedProducts.add(b);
        if (categoryProducts.has(b)) involvedProducts.add(a);
      });
    }
  }

  // Sort so active edges render last (on top)
  // When activeId is set, also sort by distance from the clicked product for sequential animation
  const sorted = [...uniqueEdges].sort((e1, e2) => {
    if (!activeId) return 0;
    const a = (e1.from === activeId || e1.to === activeId) ? 1 : 0;
    const b = (e2.from === activeId || e2.to === activeId) ? 1 : 0;
    if (a !== b) return a - b;
    
    // If both are active connections, sort by distance from origin for staggered animation
    if (a === 1 && b === 1) {
      const originProduct = productMap[activeId];
      if (!originProduct || !originProduct._px) return 0;
      
      // Calculate distance to the "other" end of each connection
      const getOtherEnd = (edge) => edge.from === activeId ? edge.to : edge.from;
      const target1 = productMap[getOtherEnd(e1)];
      const target2 = productMap[getOtherEnd(e2)];
      
      if (!target1 || !target2 || !target1._px || !target2._px) return 0;
      
      const dist1 = Math.hypot(target1._px - originProduct._px, target1._py - originProduct._py);
      const dist2 = Math.hypot(target2._px - originProduct._px, target2._py - originProduct._py);
      
      return dist1 - dist2; // Closer connections animate first
    }
    
    return 0;
  });

  // Track active connections for staggered animation
  let activeConnectionIndex = 0;
  const activeConnections = activeId ? sorted.filter(e => e.from === activeId || e.to === activeId) : [];

  sorted.forEach(edge => {
    const { from, to, plays } = edge;
    const p1 = productMap[from];
    const p2 = productMap[to];
    if (!p1._px || !p2._px) return;

    const x1 = p1._px, y1 = p1._py;
    const x2 = p2._px, y2 = p2._py;

    // Line color is derived from lane positions, not strategic play
    const colorPlayId = connectionPlayId(from, to);
    const color = playColor(colorPlayId);

    // Determine if this connection should be active/visible
    let isActive, isFiltered;
    if (activeId) {
      // When a product is selected, show its connections
      isActive = (activeId === from || activeId === to);
      isFiltered = false;
    } else if (activePlayFilter && involvedProducts) {
      // When a play filter is active, show connections between involved products
      isActive = involvedProducts.has(from) && involvedProducts.has(to);
      isFiltered = !isActive;
    } else {
      // No filter active, show all connections
      isActive = true;
      isFiltered = false;
    }

    // Determine if we need to reverse the path direction for animation
    // We want the animation to always flow FROM the clicked product
    let shouldReversePath = false;
    if (activeId && isActive) {
      // If the path is drawn from 'to' to 'from', but activeId is 'to', we need to reverse
      shouldReversePath = (from !== activeId);
    }

    let d;
    const sameRow = Math.abs(y1 - y2) < CONFIG.SAME_ROW_THRESHOLD;

    // Swap coordinates if we need to reverse the path direction
    let startX = shouldReversePath ? x2 : x1;
    let startY = shouldReversePath ? y2 : y1;
    let endX = shouldReversePath ? x1 : x2;
    let endY = shouldReversePath ? y1 : y2;

    if (tweakState.connStyle === 'ortho') {
      if (sameRow) {
        const arcH = Math.abs(endX - startX) * 0.18 + 12;
        d = `M ${startX} ${startY} L ${startX} ${startY - arcH} L ${endX} ${endY - arcH} L ${endX} ${endY}`;
      } else {
        const my = (startY + endY) / 2;
        d = `M ${startX} ${startY} L ${startX} ${my} L ${endX} ${my} L ${endX} ${endY}`;
      }
    } else {
      if (sameRow) {
        const mx = (startX + endX) / 2;
        const arcH = Math.abs(endX - startX) * CONFIG.CURVES.ARC_FACTOR;
        d = `M ${startX} ${startY} C ${mx} ${startY - arcH}, ${mx} ${endY - arcH}, ${endX} ${endY}`;
      } else {
        const bendX1 = startX + (endX - startX) * CONFIG.CURVES.BEND_START;
        const bendX2 = startX + (endX - startX) * CONFIG.CURVES.BEND_END;
        d = `M ${startX} ${startY} C ${bendX1} ${startY}, ${bendX2} ${endY}, ${endX} ${endY}`;
      }
    }

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');

    if (!activeId && !activePlayFilter) {
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.35');
    } else if (isActive && !isFiltered) {
      let pathLength = 1000;
      try {
        pathLength = path.getTotalLength() || 1000;
      } catch (e) {
        console.warn('Could not calculate path length:', e);
      }
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('opacity', '0.95');
      path.setAttribute('stroke-dasharray', pathLength);
      path.setAttribute('stroke-dashoffset', pathLength);
      path.style.setProperty('--path-length', pathLength);
      
      // Calculate staggered animation delay based on connection order
      const connectionDelay = activeId ? activeConnectionIndex * 0.15 : 0; // 150ms between each line
      path.style.animationDelay = `${connectionDelay}s`;
      
      path.classList.add('path-active');
      path.getBoundingClientRect(); // Force reflow
      
      // Increment counter for next active connection
      if (activeId && isActive) {
        activeConnectionIndex++;
      }
    } else {
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.05');
    }

    svgEl.appendChild(path);
  });
}

/* ════════════════════════════════════════════════════════
   Interaction
   ════════════════════════════════════════════════════════ */
function handleClick(id) {
  if (!productMap[id]) return;

  if (selectedId === id) {
    resetSelection();
    return;
  }

  selectedId = id;
  
  // Clear any active play filter
  if (activePlayFilter) {
    activePlayFilter = null;
    document.querySelectorAll('.legend-chip').forEach(c => c.classList.remove('is-active'));
  }
  
  // Clear any active search state
  if (searchQuery) {
    searchInput.value = '';
    searchQuery = '';
    searchClear.classList.remove('is-visible');
    searchResults.textContent = '';
  }

  const product = productMap[id];
  const neighbors = new Set(adjacency[id].map(a => a.to));
  neighbors.add(id);

  Object.entries(nodeEls).forEach(([pid, el]) => {
    el.classList.remove('dimmed', 'highlighted', 'selected');
    if (pid === id) el.classList.add('selected');
    else if (neighbors.has(pid)) el.classList.add('highlighted');
    else el.classList.add('dimmed');
  });

  drawConnections(id);
  renderSidebar(product);
  document.getElementById('reset-btn').style.display = 'inline-flex';
}

function resetSelection(redraw = true) {
  selectedId = null;
  Object.values(nodeEls).forEach(el => el.classList.remove('dimmed', 'highlighted', 'selected'));
  if (redraw) {
    drawConnections();
    renderSidebarEmpty();
  }
  document.getElementById('reset-btn').style.display = 'none';
}

document.getElementById('reset-btn').addEventListener('click', () => resetSelection());

document.getElementById('sidebar-inner').addEventListener('click', (e) => {
  const connRow = e.target.closest('.conn-row[data-target]');
  if (connRow) handleClick(connRow.dataset.target);
});

/* ════════════════════════════════════════════════════════
   Sidebar render
   ════════════════════════════════════════════════════════ */
const EMPTY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
  <circle cx="12" cy="12" r="9"/>
  <circle cx="7" cy="9" r="1.6" fill="currentColor"/>
  <circle cx="17" cy="9" r="1.6" fill="currentColor"/>
  <circle cx="12" cy="17" r="1.6" fill="currentColor"/>
  <path d="M8.5 9.5 L15.5 9.5 M8 10.5 L11 16 M16 10.5 L13 16"/>
</svg>`;

function renderSidebarEmpty() {
  document.getElementById('sidebar-inner').innerHTML = `
    <div class="sidebar-empty">
      <div class="empty-icon">${EMPTY_ICON}</div>
      <p>Select a product to highlight its cross-sell connections across the ${numberWord(nPlays)} plays.</p>
      <span class="empty-hint">No selection</span>
    </div>`;
}

function renderSidebar(product) {
  const catLabel = CATEGORIES.find(c => c.id === product.cat)?.label || '';
  const conns = adjacency[product.id];

  const playsHtml = product.plays.map(pId => {
    const play = PLAYS[pId];
    return `<span class="play-pill" style="--play-color: var(${play.varName})">
      <span class="dot"></span>${play.short}
    </span>`;
  }).join('');

  // Dedupe connected targets (a target may appear in multiple play synergies)
  const uniqueTargetIds = [...new Set(conns.map(c => c.to))];

  // Group connections by the target's primary play (its lane on the map)
  const grouped = {};
  uniqueTargetIds.forEach(tid => {
    const tp = productMap[tid].plays[0];
    (grouped[tp] ||= []).push(tid);
  });

  // Sort groups by their lane order on the map (top-to-bottom), not numeric play id
  const laneOrder = Object.fromEntries(CATEGORIES.map((c, i) => [c.playId, i]));
  const groupedHtml = Object.keys(grouped).sort((a,b) => laneOrder[a] - laneOrder[b]).map(pId => {
    const play = PLAYS[pId];
    const rows = grouped[pId].map(to => {
      const target = productMap[to];
      const targetPlay = PLAYS[target.plays[0]];
      // Find the explanation for this connection
      const conn = conns.find(c => c.to === to);
      const explanation = conn?.explanation || '';
      return `<button type="button" class="conn-row" data-target="${to}">
        <div class="conn-accent" style="--accent-color: var(${targetPlay.varName})"></div>
        <div class="conn-info">
          <div class="conn-name">${target.label}</div>
          <div class="conn-play">${targetPlay.short}</div>
          ${explanation ? `<div class="conn-explanation">${explanation}</div>` : ''}
        </div>
        <div class="conn-arrow">›</div>
      </button>`;
    }).join('');
    return `
      <div class="sb-section-label">${play.short} · ${grouped[pId].length}</div>
      <div class="conn-list">${rows}</div>`;
  }).join('');

  // Build discovery questions HTML
  const questionsHtml = product.questions ? product.questions.map((q, idx) => `
    <div class="sb-question-item">
      <div class="sb-question-icon">?</div>
      <div class="sb-question-text">${q}</div>
    </div>
  `).join('') : '';

  // Build competitive positioning HTML
  const competitorsHtml = product.competitors ? `
    <div class="sb-section-label">Competes With</div>
    <div class="sb-competitors">
      ${product.competitors.map(comp => `<span class="competitor-tag">${comp}</span>`).join('')}
    </div>
  ` : '';

  const differentiatorsHtml = product.differentiators ? `
    <div class="sb-section-label">Key Differentiators</div>
    <div class="sb-differentiators">
      ${product.differentiators.map(diff => `
        <div class="differentiator-item">
          <span class="diff-icon">✓</span>
          <span class="diff-text">${diff}</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('sidebar-inner').innerHTML = `
    <span class="sb-tag">Product</span>
    <div class="sb-product-name">${product.label}</div>
    <div class="sb-category">${catLabel}</div>

    <div class="sb-section-label">Featured in plays</div>
    <div>${playsHtml}</div>

    ${product.desc ? `
      <div class="sb-section-label">Description</div>
      <div class="sb-description">${product.desc}</div>
    ` : ''}

    ${product.value ? `
      <div class="sb-section-label">Value Proposition</div>
      <div class="sb-value">${product.value}</div>
    ` : ''}

    ${competitorsHtml}

    ${differentiatorsHtml}

    ${questionsHtml ? `
      <div class="sb-section-label">Discovery Questions</div>
      <div class="sb-questions">${questionsHtml}</div>
    ` : ''}

    <div class="sb-section-label">${uniqueTargetIds.length} connection${uniqueTargetIds.length !== 1 ? 's' : ''}</div>
    ${groupedHtml}
  `;
}

/* ════════════════════════════════════════════════════════
   Tweaks (vanilla; host protocol)
   ════════════════════════════════════════════════════════ */
const tweaksPanel = document.getElementById('tweaks-panel');
const appRoot = document.getElementById('app');

function applyTweaks() {
  appRoot.dataset.theme = tweakState.theme;
  appRoot.dataset.nodeStyle = tweakState.nodeStyle;
  appRoot.dataset.connStyle = tweakState.connStyle;
  // refresh visible state
  document.querySelectorAll('.tweak-seg').forEach(seg => {
    const key = seg.dataset.tweak;
    seg.querySelectorAll('button').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.value === String(tweakState[key]));
    });
  });
  // Lane fill change requires recompute - cancel any pending resize
  clearTimeout(resizeTimer);
  computeLayout();
  if (selectedId) drawConnections(selectedId);
  else if (activePlayFilter) drawConnections();
  else drawConnections();
}

document.querySelectorAll('.tweak-seg button').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.parentElement.dataset.tweak;
    const value = btn.dataset.value;
    tweakState = { ...tweakState, [key]: value };
    applyTweaks();
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
    } catch (e) { /* host may not be present */ }
  });
});

// Host protocol — listener BEFORE announce
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === '__activate_edit_mode') {
    tweaksPanel.classList.add('is-open');
  } else if (msg.type === '__deactivate_edit_mode') {
    tweaksPanel.classList.remove('is-open');
  }
});

document.getElementById('tweaks-close').addEventListener('click', () => {
  tweaksPanel.classList.remove('is-open');
  try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch (e) {}
});

try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}

// Header theme toggle button
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = tweakState.theme === 'dark' ? 'light' : 'dark';
  tweakState = { ...tweakState, theme: next };
  applyTweaks();
  try {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: next } }, '*');
  } catch (e) {}
});

/* ════════════════════════════════════════════════════════
   Init & resize
   ════════════════════════════════════════════════════════ */
function init() {
  renderSidebarEmpty();
  applyTweaks(); // sets data-theme etc. + first computeLayout/drawConnections
  mobileInit();  // build mobile UI (no-op on desktop — guarded inside)
}

let resizeTimer;

function scheduleLayoutUpdate() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    computeLayout();
    if (selectedId) drawConnections(selectedId);
    else if (activePlayFilter) drawConnections();
    else drawConnections();
  }, 80);
}

window.addEventListener('resize', scheduleLayoutUpdate);

requestAnimationFrame(() => requestAnimationFrame(init));

/* ════════════════════════════════════════════════════════
   MOBILE UI
   Builds and manages the accordion + bottom-drawer view.
   All code here is guarded by an isMobile() check so it
   never runs (or interferes) on desktop.
   ════════════════════════════════════════════════════════ */

function isMobile() {
  return window.matchMedia('(max-width: 768px)').matches;
}

/* ── State ── */
let mobActivePlayFilter = null;
let mobSearchQuery = '';
let mobSelectedId = null;

/* ── Element refs (assigned in mobileInit) ── */
let mobAccordion, mobLegendEl, mobSearchInput, mobSearchClear, mobSearchResults;
let mobDrawer, mobDrawerOverlay, mobDrawerBody, mobDrawerTitle, mobDrawerClose, mobDrawerHandleBar;

/* ────────────────────────────────────────────────────────
   mobileInit — entry point called from init()
   ──────────────────────────────────────────────────────── */
function mobileInit() {
  // Assign refs
  mobAccordion      = document.getElementById('mobile-accordion');
  mobLegendEl       = document.getElementById('mobile-legend');
  mobSearchInput    = document.getElementById('mob-search-input');
  mobSearchClear    = document.getElementById('mob-search-clear');
  mobSearchResults  = document.getElementById('mobile-search-results');
  mobDrawer         = document.getElementById('mob-drawer');
  mobDrawerOverlay  = document.getElementById('mob-drawer-overlay');
  mobDrawerBody     = document.getElementById('mob-drawer-body');
  mobDrawerTitle    = document.getElementById('mob-drawer-title');
  mobDrawerClose    = document.getElementById('mob-drawer-close');
  mobDrawerHandleBar= document.getElementById('mob-drawer-handle-bar');

  // Build legend chips
  Object.values(PLAYS).forEach(play => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'mobile-legend-chip';
    chip.dataset.play = play.id;
    chip.style.setProperty('--legend-color', `var(${play.varName})`);
    chip.innerHTML = `<span class="dot" style="background:var(${play.varName})"></span>${play.short}`;
    chip.title = play.name;
    chip.addEventListener('click', () => mobTogglePlayFilter(play.id));
    mobLegendEl.appendChild(chip);
  });

  // Build accordion
  mobBuildAccordion();

  // Apply current theme immediately so drawer inherits it
  mobSyncTheme();

  // Search events
  mobSearchInput.addEventListener('input', e => mobPerformSearch(e.target.value));
  mobSearchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { mobSearchInput.value = ''; mobPerformSearch(''); mobSearchInput.blur(); }
  });
  mobSearchClear.addEventListener('click', () => {
    mobSearchInput.value = ''; mobPerformSearch(''); mobSearchInput.focus();
  });

  // Drawer close events
  mobDrawerClose.addEventListener('click', mobCloseDrawer);
  mobDrawerOverlay.addEventListener('click', mobCloseDrawer);
  mobDrawerHandleBar.addEventListener('click', mobCloseDrawer);
  mobDrawerHandleBar.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') mobCloseDrawer(); });

  // Drawer body: tapping a connection row opens that product
  mobDrawerBody.addEventListener('click', e => {
    const row = e.target.closest('.conn-row[data-target]');
    if (row) mobOpenDrawer(row.dataset.target);
  });

  // Sync theme when tweaks change (theme toggle on header also fires applyTweaks)
  const origApplyTweaks = applyTweaks;
  // We patched applyTweaks at the bottom of mobileInit
}

/* ────────────────────────────────────────────────────────
   Patch applyTweaks so theme changes propagate to mobile
   ──────────────────────────────────────────────────────── */
const _origApplyTweaks = applyTweaks;
applyTweaks = function() {
  _origApplyTweaks.apply(this, arguments);
  mobSyncTheme();
};

function mobSyncTheme() {
  // The #app data-theme attribute drives CSS variables. The drawer and
  // mobile-view are inside #app so they automatically inherit. Nothing extra needed.
}

/* ────────────────────────────────────────────────────────
   Build accordion
   ──────────────────────────────────────────────────────── */
function mobBuildAccordion() {
  mobAccordion.innerHTML = '';

  CATEGORIES.forEach((cat, catIdx) => {
    const play        = PLAYS[cat.playId];
    const products    = PRODUCTS.filter(p => p.cat === cat.id);
    const connCount   = id => adjacency[id].length;

    const lane = document.createElement('div');
    lane.className = 'mob-lane';
    lane.dataset.cat = cat.id;
    // First lane open by default
    if (catIdx === 0) lane.classList.add('is-open');

    // Header button
    const header = document.createElement('button');
    header.type = 'button';
    header.className = 'mob-lane-header';
    header.setAttribute('aria-expanded', catIdx === 0 ? 'true' : 'false');
    header.innerHTML = `
      <span class="mob-lane-dot" style="background:var(${play.varName})"></span>
      <span class="mob-lane-title">${cat.label}</span>
      <span class="mob-lane-count">${products.length}</span>
      <span class="mob-lane-chevron" aria-hidden="true">›</span>`;
    header.addEventListener('click', () => {
      const isOpen = lane.classList.toggle('is-open');
      header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // Body with product cards
    const body = document.createElement('div');
    body.className = 'mob-lane-body';
    body.setAttribute('role', 'list');

    products.forEach(p => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'mob-product-card';
      card.dataset.id = p.id;
      card.setAttribute('role', 'listitem');
      const nc = connCount(p.id);
      const primaryPlay = PLAYS[p.plays[0]];
      card.innerHTML = `
        <span class="mob-product-accent" style="--node-color:var(${primaryPlay.varName})"></span>
        <span class="mob-product-label">${p.label}</span>
        <span class="mob-product-conns">${nc} link${nc !== 1 ? 's' : ''}</span>
        <span class="mob-product-arrow" aria-hidden="true">›</span>`;
      card.addEventListener('click', () => mobOpenDrawer(p.id));
      body.appendChild(card);
    });

    lane.appendChild(header);
    lane.appendChild(body);
    mobAccordion.appendChild(lane);
  });
}

/* ────────────────────────────────────────────────────────
   Open / close drawer
   ──────────────────────────────────────────────────────── */
function mobOpenDrawer(productId) {
  if (!productMap[productId]) return;
  mobSelectedId = productId;
  const product = productMap[productId];

  // Set drawer title
  mobDrawerTitle.textContent = product.label;

  // Render full sidebar content into drawer body
  // renderSidebar writes to #sidebar-inner — we replicate its output here
  mobDrawerBody.innerHTML = mobRenderProductDetail(product);

  // Show drawer
  mobDrawer.classList.add('is-open');
  mobDrawerOverlay.classList.add('is-open');
  mobDrawerOverlay.removeAttribute('aria-hidden');
  document.body.style.overflow = 'hidden'; // prevent background scroll

  // Focus management
  requestAnimationFrame(() => mobDrawerClose.focus());
}

function mobCloseDrawer() {
  mobDrawer.classList.remove('is-open');
  mobDrawerOverlay.classList.remove('is-open');
  mobDrawerOverlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  mobSelectedId = null;
}

/* ────────────────────────────────────────────────────────
   Render product detail HTML for the drawer
   (mirrors renderSidebar but returns a string instead of
    writing to #sidebar-inner)
   ──────────────────────────────────────────────────────── */
function mobRenderProductDetail(product) {
  const catLabel = CATEGORIES.find(c => c.id === product.cat)?.label || '';
  const conns = adjacency[product.id];

  const playsHtml = product.plays.map(pId => {
    const play = PLAYS[pId];
    return `<span class="play-pill" style="--play-color:var(${play.varName})">
      <span class="dot"></span>${play.short}
    </span>`;
  }).join('');

  // Dedupe connected targets
  const uniqueTargetIds = [...new Set(conns.map(c => c.to))];

  // Group by target's primary play lane
  const grouped = {};
  uniqueTargetIds.forEach(tid => {
    const tp = productMap[tid].plays[0];
    (grouped[tp] ||= []).push(tid);
  });

  const laneOrder = Object.fromEntries(CATEGORIES.map((c, i) => [c.playId, i]));
  const groupedHtml = Object.keys(grouped).sort((a,b) => laneOrder[a] - laneOrder[b]).map(pId => {
    const play = PLAYS[pId];
    const rows = grouped[pId].map(to => {
      const target = productMap[to];
      const targetPlay = PLAYS[target.plays[0]];
      const conn = conns.find(c => c.to === to);
      const explanation = conn?.explanation || '';
      return `<button type="button" class="conn-row" data-target="${to}">
        <div class="conn-accent" style="--accent-color:var(${targetPlay.varName})"></div>
        <div class="conn-info">
          <div class="conn-name">${target.label}</div>
          <div class="conn-play">${targetPlay.short}</div>
          ${explanation ? `<div class="conn-explanation">${explanation}</div>` : ''}
        </div>
        <div class="conn-arrow">›</div>
      </button>`;
    }).join('');
    return `
      <div class="sb-section-label">${play.short} · ${grouped[pId].length}</div>
      <div class="conn-list">${rows}</div>`;
  }).join('');

  const questionsHtml = product.questions ? product.questions.map(q => `
    <div class="sb-question-item">
      <div class="sb-question-icon">?</div>
      <div class="sb-question-text">${q}</div>
    </div>`).join('') : '';

  const competitorsHtml = product.competitors ? `
    <div class="sb-section-label">Competes With</div>
    <div class="sb-competitors">
      ${product.competitors.map(comp => `<span class="competitor-tag">${comp}</span>`).join('')}
    </div>` : '';

  const differentiatorsHtml = product.differentiators ? `
    <div class="sb-section-label">Key Differentiators</div>
    <div class="sb-differentiators">
      ${product.differentiators.map(diff => `
        <div class="differentiator-item">
          <span class="diff-icon">✓</span>
          <span class="diff-text">${diff}</span>
        </div>`).join('')}
    </div>` : '';

  return `
    <span class="sb-tag">${catLabel}</span>

    <div class="sb-section-label">Featured in plays</div>
    <div>${playsHtml}</div>

    ${product.desc ? `
      <div class="sb-section-label">Description</div>
      <div class="sb-description">${product.desc}</div>
    ` : ''}

    ${product.value ? `
      <div class="sb-section-label">Value Proposition</div>
      <div class="sb-value">${product.value}</div>
    ` : ''}

    ${competitorsHtml}
    ${differentiatorsHtml}

    ${questionsHtml ? `
      <div class="sb-section-label">Discovery Questions</div>
      <div class="sb-questions">${questionsHtml}</div>
    ` : ''}

    <div class="sb-section-label">${uniqueTargetIds.length} connection${uniqueTargetIds.length !== 1 ? 's' : ''}</div>
    ${groupedHtml}
  `;
}

/* ────────────────────────────────────────────────────────
   Play filter on mobile
   ──────────────────────────────────────────────────────── */
function mobTogglePlayFilter(playId) {
  // Clear search
  if (mobSearchQuery) {
    mobSearchInput.value = '';
    mobSearchQuery = '';
    mobSearchClear.classList.remove('is-visible');
    mobSearchResults.textContent = '';
  }

  mobActivePlayFilter = (mobActivePlayFilter === playId) ? null : playId;

  document.querySelectorAll('#mobile-legend .mobile-legend-chip').forEach(c => {
    c.classList.toggle('is-active', Number(c.dataset.play) === mobActivePlayFilter);
  });

  mobApplyFilters();
}

/* ────────────────────────────────────────────────────────
   Search on mobile
   ──────────────────────────────────────────────────────── */
function mobPerformSearch(raw) {
  mobSearchQuery = raw.toLowerCase().trim();
  mobSearchClear.classList.toggle('is-visible', mobSearchQuery.length > 0);

  // Clear play filter when searching
  if (mobSearchQuery && mobActivePlayFilter) {
    mobActivePlayFilter = null;
    document.querySelectorAll('#mobile-legend .mobile-legend-chip').forEach(c => c.classList.remove('is-active'));
  }

  mobApplyFilters();
}

/* ────────────────────────────────────────────────────────
   Apply filters (search OR play) to the accordion
   ──────────────────────────────────────────────────────── */
function mobApplyFilters() {
  // Determine which product IDs pass the current filter
  let involvedIds = null; // null = show all

  if (mobSearchQuery) {
    const matches = new Set();
    PRODUCTS.forEach(p => {
      const text = [p.label, p.desc || '', p.value || '', ...(p.questions || [])].join(' ').toLowerCase();
      if (text.includes(mobSearchQuery)) matches.add(p.id);
    });
    // Also include connected products
    involvedIds = new Set(matches);
    CONNECTIONS.forEach(([a, b]) => {
      if (matches.has(a)) involvedIds.add(b);
      if (matches.has(b)) involvedIds.add(a);
    });
    // Update results count
    mobSearchResults.textContent = `${matches.size} product${matches.size !== 1 ? 's' : ''} found`;
  } else if (mobActivePlayFilter) {
    const playCategory = CATEGORIES.find(cat => cat.playId === mobActivePlayFilter);
    if (playCategory) {
      const catProducts = new Set(PRODUCTS.filter(p => p.cat === playCategory.id).map(p => p.id));
      involvedIds = new Set(catProducts);
      CONNECTIONS.forEach(([a, b]) => {
        if (catProducts.has(a)) involvedIds.add(b);
        if (catProducts.has(b)) involvedIds.add(a);
      });
    }
    mobSearchResults.textContent = '';
  } else {
    mobSearchResults.textContent = '';
  }

  // Apply dim/highlight classes to product cards and auto-expand matching lanes
  document.querySelectorAll('.mob-lane').forEach(lane => {
    const catId = lane.dataset.cat;
    const cards = lane.querySelectorAll('.mob-product-card');
    let laneHasMatch = false;

    cards.forEach(card => {
      const id = card.dataset.id;
      card.classList.remove('dimmed', 'highlighted');
      if (involvedIds === null) {
        // No filter — show all
      } else if (involvedIds.has(id)) {
        card.classList.add('highlighted');
        laneHasMatch = true;
      } else {
        card.classList.add('dimmed');
      }
    });

    // Auto-expand lanes that have matching products; collapse lanes with none
    if (involvedIds !== null) {
      const laneHeader = lane.querySelector('.mob-lane-header');
      if (laneHasMatch) {
        lane.classList.add('is-open');
        laneHeader.setAttribute('aria-expanded', 'true');
      } else {
        lane.classList.remove('is-open');
        laneHeader.setAttribute('aria-expanded', 'false');
      }
    }
  });
}
</script>
